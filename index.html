const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unwrap(pw,users){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  for(const u of (users||D.users)){
    const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(u.salt),iterations:D.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    try{const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(u.iv)},kek,b64(u.wrapped));
        return await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);}catch(_){}
  }
  throw new Error('no');
}
async function unz(key,iv,ct){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(iv)},key,b64(ct));
  const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(new Uint8Array(pt));w.close();
  return await new Response(ds.readable).text();
}

function sw(id,label,view){return '<script>(function(){var a=document.getElementById('+JSON.stringify(id)+');if(!a){a=document.createElement("a");a.style.cssText="position:fixed;right:10px;bottom:10px;z-index:99;padding:8px 14px;border-radius:999px;background:#cb4727;color:#fff;font:600 13px system-ui;text-decoration:none";document.body.appendChild(a)}a.style.display="";a.textContent='+JSON.stringify(label)+';a.href="#";a.onclick=function(e){e.preventDefault();try{sessionStorage.setItem("mt_view",'+JSON.stringify(view)+')}catch(_){}history.replaceState(null,"",location.pathname+location.search);location.reload()};if('+JSON.stringify(view)+'==="extra"){var bar=document.createElement("form");bar.style.cssText="position:sticky;top:0;z-index:98;display:flex;gap:8px;align-items:center;padding:8px 12px;background:#fff;border-bottom:2px solid #cb4727";bar.innerHTML="<input type=search placeholder=\'Найти по всем панелям: поставщик, сумма, документ, 900 тысяч, неликвид, регион\' style=\'flex:1;min-width:0;font-size:16px;padding:9px 12px;border:1px solid #bbb;border-radius:10px\'><button style=\'font-size:15px;font-weight:700;padding:9px 16px;border:0;border-radius:10px;background:#cb4727;color:#fff\'>Найти</button>";document.body.insertBefore(bar,document.body.firstChild);var go=function(q){try{sessionStorage.setItem("mt_view","extra");sessionStorage.setItem("mt_q",q)}catch(_){}history.replaceState(null,"",location.pathname+location.search);location.reload()};bar.onsubmit=function(e){e.preventDefault();go(bar.firstChild.value)};var b2=document.createElement("button");b2.type="button";b2.textContent=a.textContent;b2.style.cssText="font-size:15px;font-weight:700;padding:9px 16px;border:2px solid #cb4727;border-radius:10px;background:#fff;color:#cb4727;white-space:nowrap";b2.onclick=function(){go("")};bar.appendChild(b2)}})()<\/script>'}
async function open(pw){
  const key=await unwrap(pw);
  let html=await unz(key,D.iv,D.ct);
  if(D.extra){let k2=null;try{k2=await unwrap(pw,D.extra.users)}catch(_){}
    if(k2){let v='main';try{v=sessionStorage.getItem('mt_view')||'main'}catch(_){}
      if(v==='extra'){html=(await unz(k2,D.extra.iv,D.extra.ct))+sw(D.extra.back_id,D.extra.back_label,'main');let q=null;try{q=sessionStorage.getItem('mt_q');sessionStorage.removeItem('mt_q')}catch(_){}if(q!==null)html+='<script>location.hash="view=search&q="+encodeURIComponent('+JSON.stringify(q)+')<\/script>';}
      else html+=sw(D.extra.btn_id,D.extra.label,'extra');}}

  document.open();document.write(html);document.close();
}
